<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شركة جادو — قائمة الأسعار</title>

<!-- ============================================================
     تثبيت التطبيق (PWA) + العمل بدون إنترنت
     ============================================================ -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F0E0D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="جادو">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">

<!-- ============================================================
     Firebase (صور الأصناف فقط — صفحة الزبون لا تستخدم أي دخول)
     ============================================================ -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- ============================================================
     بحث الأصناف: قراءة الشيت + مسح الكيو آر كود
     ============================================================ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="item-images.js"></script>
<script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>

<link rel="stylesheet" href="app.css">
</head>
<body data-page="customer">

<div class="app">

  <!-- ============ الشاشة الرئيسية ============ -->
  <div class="view active" id="view-gate">
    <div class="hero">
      <!-- مقدمة متحركة: الشعار يتكوّن من العدم، ثم يتوقف على آخر لقطة (الشعار كاملًا) -->
      <video id="heroIntro" src="jadu-intro.mp4" poster="jadu-intro-poster.jpg" muted playsinline preload="none"
             aria-label="شركة جادو — لإستيراد معدات المطاعم والمقاهي"></video>
      <!-- الصورة الثابتة لا تُحمَّل إلا إذا تعذّر تشغيل الفيديو -->
      <img id="heroLogo" data-src="jadu-logo.png" alt="شركة جادو — لإستيراد معدات المطاعم والمقاهي" hidden>
    </div>
    <div class="headline">
      <p>اختر التصنيف للتصفح</p>
    </div>
    <div class="cat-grid" id="gateCategoryGrid"><!-- تُبنى ديناميكيًا --></div>
    <footer>© شركة جادو — لإستيراد معدات المطاعم والمقاهي<br><span style="opacity:.6; font-size:10.5px;">آخر تحديث: 1 أكتوبر 2026</span></footer>
  </div>

  <!-- ============ واجهة الموظف — بحث الأصناف ============ -->
  <div class="view" id="view-employee">
    <div class="back-row">
      <button class="back-btn" id="employeeBackBtn" aria-label="رجوع">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h2 id="employeeHeaderTitle">اختر التصنيف</h2>
    </div>

    <!-- شاشة اختيار التصنيف -->
    <div id="employeeCategoryScreen">
      <div class="cat-grid" id="employeeCategoryGrid"><!-- تُبنى ديناميكيًا --></div>
    </div>

    <!-- شاشة البحث -->
    <div id="employeeSearchScreen" style="display:none;">
      <div class="search-row">
        <input type="text" id="employeeSearchInput" placeholder="ابحث برقم الصنف أو الاسم…">
        <button class="scan-btn" id="employeeScanBtn" title="مسح كيو آر كود أو باركود" aria-label="مسح كيو آر كود أو باركود">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>
            <rect x="7" y="7" width="10" height="10" rx="1"/>
          </svg>
        </button>
      </div>
      <div class="item-count" id="employeeItemCount"><span class="spinner"></span> جارِ تحميل بيانات الأصناف…</div>
      <div class="results" id="employeeResults"></div>
    </div>

    <!-- شاشة تفاصيل الصنف -->
    <div id="employeeDetailScreen" style="display:none;">
      <div class="item-card" id="employeeItemCard"><!-- تُبنى ديناميكيًا --></div>

      <!-- إضافة/تغيير صورة الصنف — للموظف والإدارة فقط (مخفي للزبون) -->
      <div class="photo-upload-row" id="photoUploadRow" hidden>
        <label class="photo-upload-btn" for="photoInput">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span id="photoUploadLabel">إضافة صورة للصنف</span>
        </label>
        <input type="file" id="photoInput" accept="image/*" hidden>
        <button type="button" class="photo-delete-btn" id="photoDeleteBtn" hidden>حذف الصورة</button>
        <div class="msg" id="photoUploadMsg" role="status"></div>
      </div>

      <!-- بيانات الشراء — تظهر فقط للإدارة العامة -->
      <div id="adminPurchaseInfo" style="display:none; margin-top:14px;"></div>

      <!-- زر تغيير السعر — يظهر فقط للإدارة العامة -->
      <div class="share-row" id="adminPriceChangeRow" style="display:none; margin-top:14px;">
        <button class="primary-btn" id="openPriceChangeBtn" style="margin-top:0;">تغيير السعر</button>
      </div>

      <!-- نموذج تغيير السعر -->
      <div id="priceChangeForm" class="price-change-form" style="display:none;">
        <div class="section-label">تغيير السعر — <span id="pcfItemNum"></span></div>
        <div class="field">
          <label>السعر القطاعي الجديد (الحالي: <span id="pcfOldRetail"></span>)</label>
          <input type="text" inputmode="decimal" id="pcfNewRetail" placeholder="اتركه فارغًا إذا بدون تغيير" style="direction:ltr; letter-spacing:normal;">
        </div>
        <div class="field">
          <label>سعر الجملة الجديد (الحالي: <span id="pcfOldWholesale"></span>)</label>
          <input type="text" inputmode="decimal" id="pcfNewWholesale" placeholder="اتركه فارغًا إذا بدون تغيير" style="direction:ltr; letter-spacing:normal;">
        </div>
        <button class="primary-btn" id="pcfAddBtn">إضافة إلى قائمة تغيير الأسعار</button>
        <div class="msg" id="pcfMsg"></div>
      </div>

      <div class="share-row" id="employeeShareRow" style="margin-top:16px;">
        <button class="share-btn wa" id="shareWhatsappBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5A11 11 0 0 0 3.6 17.3L2 22l4.8-1.6A11 11 0 1 0 20.5 3.5Zm-8.5 17a9 9 0 0 1-4.6-1.3l-.3-.2-3.3 1.1 1.1-3.2-.2-.3A9 9 0 1 1 12 20.5Zm5-6.7c-.3-.1-1.6-.8-1.8-.9-.2-.1-.4-.1-.6.1s-.7.9-.9 1-.3.2-.6.1a7.3 7.3 0 0 1-2.1-1.3 8 8 0 0 1-1.5-1.9c-.2-.3 0-.5.1-.6l.4-.5.2-.4v-.4C10 8.9 9.5 7.6 9.3 7.1c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-1 2.3c0 1.3.9 2.6 1.1 2.8.1.2 1.9 2.9 4.6 4a15 15 0 0 0 1.5.6c.6.2 1.2.2 1.6.1.5-.1 1.6-.6 1.8-1.3.2-.6.2-1.1.2-1.2s-.2-.2-.5-.3Z"/></svg>
          مشاركة عبر واتساب
        </button>
        <button class="share-btn" id="shareMoreBtn" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5 15.4 17.5M15.4 6.5 8.6 10.5"/></svg>
          مشاركة أخرى
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ============ كاميرا مسح الكيو آر كود ============ -->
<div class="cam-overlay" id="camOverlay">
  <button class="cam-close" id="camCloseBtn" aria-label="إغلاق الكاميرا">✕</button>
  <video id="camVideo" playsinline autoplay muted></video>
  <canvas id="camZoomCanvas"></canvas>
  <div class="cam-frame" id="camFrame"></div>
  <div class="cam-hint" id="camHint">وجّه الكاميرا نحو الكيو آر كود أو الباركود الخاص بالمنتج</div>
</div>

<!-- ============ نافذة تأكيد/تنبيه عامة ============ -->
<div class="dlg-overlay" id="dlgOverlay">
  <div class="dlg-card">
    <h2 id="dlgTitle"></h2>
    <p id="dlgMessage"></p>
    <div class="dlg-actions">
      <button class="dlg-btn" id="dlgCancelBtn">إلغاء</button>
      <button class="dlg-btn primary" id="dlgOkBtn">تأكيد</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="عرض الصورة">
  <img id="lbImg" alt="" referrerpolicy="no-referrer">
  <button type="button" class="lb-btn lb-close" id="lbClose" aria-label="إغلاق">✕</button>
  <div class="lb-bar">
    <button type="button" class="lb-btn" id="lbOut" aria-label="تصغير">−</button>
    <button type="button" class="lb-btn" id="lbReset" aria-label="الحجم الأصلي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
    <button type="button" class="lb-btn" id="lbIn" aria-label="تكبير">+</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
